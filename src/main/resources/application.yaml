server:
  port: 8080
spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
  main:
    allow-bean-definition-overriding: true
  application:
    name: ClaimsAIOllama
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
#        model: llama3.2-vision
        model: llama3.1:8b
        options:
          temperature: 0.1
          num-ctx: 16384
      embedding:
        model: nomic-embed-text
        options:
          num-ctx: 8096
          truncate: true
    vectorstore:
      pgvector:
        initialize-schema: true
        remove-existing-vector-store-table: true
        distance-type: cosine_distance

  datasource:
    driver-class-name: org.postgresql.Driver
    password:
    url: jdbc:postgresql://localhost/claimAIDB
    username: postgres
  jpa:
    database: POSTGRESQL
    show-sql: false
    hibernate:
      ddl-auto: update

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/claimAIDB
    username: postgres
    password:
    pool:
      initial-size: 5
      max-size: 20


logging:
  level:
    org:
    springframework:
      ai:
        chat: DEBUG
        advisor: DEBUG
      #              embeddings: DEBUG
      vectorstore:
#              PGVectorStore: DEBUG

langchain4j:
  ollama:
    chat-model:
      model: llama3.1:8b
      base-url: http://localhost:11434
      temperature: 0.1
      num-ctx: 4096
      log-requests: false
      log-responses: false

